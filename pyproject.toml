[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panel-compiler"
version = "0.1.11"
description = "Compose SVG figures and LaTeX equations into a panel template"
readme = "README.md"
authors = [{ name = "Matthias Függer", email = "mfuegger@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
pc = "panel_compiler.cli:main"

[tool.hatch.build.targets.wheel]
include = ["pc.py", "panel_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["panel_compiler", "pc"]
branch = true

[tool.coverage.report]
fail_under = 95
precision = 2

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = ["example", ".venv"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
